services:
  db:
    image: postgres:16-alpine
    container_name: livestream-m0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: livestream
      POSTGRES_PASSWORD: livestream
      POSTGRES_DB: livestream_m0
    ports:
      - "5432:5432"
    volumes:
      - livestream-m0-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livestream -d livestream_m0"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  livestream-m0-pgdata:
